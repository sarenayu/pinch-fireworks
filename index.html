<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#030812" />
    <meta name="description" content="Launch fireworks over a night skyline with a pinch." />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23030812'/%3E%3Cg stroke='%23ffd36a' stroke-width='2' stroke-linecap='round'%3E%3Cpath d='M16 5v6M16 21v6M5 16h6M21 16h6M8.2 8.2l4.2 4.2M19.6 19.6l4.2 4.2M23.8 8.2l-4.2 4.2M12.4 19.6l-4.2 4.2'/%3E%3C/g%3E%3Ccircle cx='16' cy='16' r='2.8' fill='%23ff6f91'/%3E%3C/svg%3E" />
    <title>Pinch the Sky</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main id="stage" aria-label="Night skyline fireworks stage">
      <img class="sky" src="assets/night-sky.png" alt="A crescent moon above a city at night" />
      <div class="vignette" aria-hidden="true"></div>
      <canvas id="fireworks" aria-hidden="true"></canvas>

      <header class="brand">
        <span class="brand-mark" aria-hidden="true">✦</span>
        <span>Pinch the Sky</span>
      </header>

      <section class="welcome" id="welcome" aria-labelledby="title">
        <p class="eyebrow">Your hands light the night</p>
        <h1 id="title">Pinch your fingers.<br /><em>Make a wish.</em></h1>
        <p class="intro">Bring your thumb and index finger together to launch a firework wherever your hand is.</p>
        <button id="startButton" class="primary" type="button">
          <span>Enable camera</span>
          <span class="arrow" aria-hidden="true">→</span>
        </button>
        <p class="privacy"><span aria-hidden="true">◉</span> Your camera stays on this device</p>
      </section>

      <aside class="camera-card" id="cameraCard" aria-label="Hand tracking preview" hidden>
        <div class="camera-frame">
          <video id="webcam" autoplay playsinline muted></video>
          <canvas id="handGuide" aria-hidden="true"></canvas>
          <div class="scan-line" aria-hidden="true"></div>
        </div>
        <div class="camera-meta">
          <div>
            <span class="status-dot" id="statusDot" aria-hidden="true"></span>
            <span id="statusText" role="status">Loading hand tracking…</span>
          </div>
          <span class="pinch-meter" id="pinchMeter">Hand not found</span>
        </div>
      </aside>

      <div class="hint" id="hint" hidden>
        <span class="pinch-icon" aria-hidden="true"><i></i><b></b></span>
        <span><strong>Pinch to launch</strong><small>Open your fingers between bursts</small></span>
      </div>

      <button class="demo" id="demoButton" type="button" aria-label="Launch a sample firework">Try a burst</button>
      <div class="toast" id="toast" role="alert" hidden></div>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
